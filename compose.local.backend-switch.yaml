# Windows 백엔드를 Docker로 전환할 때 사용하는 설정
services:
  backend:
    environment:
      # Oracle Wallet 위치를 Docker 경로로 고정
      TRIPPAMINE_WALLET_DIR: /opt/trippamine/wallets

      # 기존 Windows Vision 서버 사용 및 자동 실행 방지
      SPRING_APPLICATION_JSON: '{"fastapi":{"auto-start":false,"watchdog-enabled":false,"url":"http://host.docker.internal:8000"}}'

      # 검증된 로컬 AI 서버 연결
      TRIPPAMINE_AI_BASE_URL: http://host.docker.internal:18001
      TRIPPAMINE_MANAGER_SLM_BASE_URL: http://host.docker.internal:18002

      # Docker Frontend 및 Admin 주소
      OAUTH2_REDIRECT_URI: http://localhost:15173/oauth/callback
      CORS_ALLOWED_ORIGINS: http://localhost:15173,http://localhost:15174,http://localhost:5173,http://localhost:5174

    # Windows와 Docker의 Gradle 빌드 결과 분리
    volumes:
      - backend_build:/workspace/build

    # 앞서 컴파일에 성공한 Gradle 프로젝트 캐시 경로 사용
    command: ["sh", "./gradlew", "--project-cache-dir", "/root/.gradle/trippamine-project-cache", "bootRun", "--no-daemon"]

  frontend:
    environment:
      LOCAL_BACKEND_URL: http://backend:8080

  admin:
    environment:
      LOCAL_BACKEND_URL: http://backend:8080

volumes:
  backend_build: