# POI 검증 정책. 새로운 시설명/지역 접두어가 필요하면 Java 수정 없이 관리한다.
# 쉼표로 구분한다. 이 설정은 현재 유형 CT1/AT4의 명백한 비관광시설에 적용된다.
trippamine.poi.excluded-tokens=학교,대학교,학원,교습소,입시,연구실,연구소,직원전용,관리사무소,화장실,주차장,매표소,별관,전시동
# 이름의 도시 접두어와 실제 주소의 지역 불일치를 감지하는 기본 휴리스틱.
# 모든 한국 행정구역을 완전히 포함하지 않으므로 외부 API의 공식 장소 분류·좌표도 함께 검사한다.
trippamine.poi.region-prefixes=서울,부산,인천,대구,대전,광주,울산,세종,제주,수원,경주,전주,강릉,여수,속초,춘천,성남,포항
