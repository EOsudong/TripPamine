spring:
  application:
    name: TripPamineBE
  datasource:
    # 오라클 JDBC 드라이버
    driver-class-name: oracle.jdbc.OracleDriver
    # URL 구성: jdbc:oracle:thin:@<TNS_ALIAS>?TNS_ADMIN=<지갑_ZIP파일_경로>
    url: jdbc:oracle:thin:@trippamine_high?TNS_ADMIN=./TripPamineBE/src/main/resources/wallets
    #url: jdbc:oracle:thin:@trippamine_high?TNS_ADMIN=./src/main/resources/wallets
    # DB 계정 정보
    username: TripPamine
    password: TeamProj1234

  # 애플리케이션 실행 시 DDL(테이블 생성/수정) 자동 관리 옵션
  jpa:
    hibernate:
      ddl-auto: update
      # SQL 출력 및 포맷팅 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true             # 콘솔에 출력되는 SQL을 보기 좋게 줄바꿈
        highlight_sql: true          # 콘솔 SQL에 색상(하이라이팅) 부여
        use_sql_comments: true       # Executing 어떤 쿼리/메서드인지 주석 표시
        default_batch_fetch_size: 100 # 성능 최적화 (N+1 문제 방지용 지연 로딩 일괄 조회)

  # 소셜 로그인 Provider 등록정보
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
          #              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me

  # 파일 업로드 용량 설정 (영수증 OCR 이미지 첨부용)
  servlet:
    multipart:
      max-file-size: 10MB       # 파일 하나당 최대 용량
      max-request-size: 10MB    # 한 요청당 전체 최대 용량

server:
  port: 8080

  jwt:
    secret: {"JWT_SECRET_KEY"}
    expiration: 3600000

# 구글 OCR API 사용을 위한 서비스 계정 키 파일 경로 설정
google:
  cloud:
    vision:
      credentials:
        location: classpath:API/google-credentials.json



