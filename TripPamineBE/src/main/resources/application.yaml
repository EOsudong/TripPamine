spring:
  application:
    name: TripPamineBE
  datasource:
    # 오라클 JDBC 드라이버
    driver-class-name: oracle.jdbc.OracleDriver
    # URL 구성: jdbc:oracle:thin:@<TNS_ALIAS>?TNS_ADMIN=<지갑_ZIP파일_경로>
    # url: ${DB_URL}
    url: ${DB_URL}
    # DB 계정 정보
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  # 애플리케이션 실행 시 DDL(테이블 생성/수정) 자동 관리 옵션
  jpa:
    hibernate:
      ddl-auto: validate
      # SQL 출력 및 포맷팅 설정
    show-sql: true
    properties:
      hibernate:
        format_sql: true             # 콘솔에 출력되는 SQL을 보기 좋게 줄바꿈
        highlight_sql: true          # 콘솔 SQL에 색상(하이라이팅) 부여
        use_sql_comments: true       # Executing 어떤 쿼리/메서드인지 주석 표시
        default_batch_fetch_size: 100 # 성능 최적화 (N+1 문제 방지용 지연 로딩 일괄 조회)

  # 소셜 로그인 Provider 등록정보
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - account_email
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - profile
              - email
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            authorization-grant-type: authorization_code
            scope:
              - name
              - email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  # 파일 업로드 용량 설정 (영수증 OCR 이미지 첨부용)
  servlet:
    multipart:
      max-file-size: 10MB       # 파일 하나당 최대 용량
      max-request-size: 10MB    # 한 요청당 전체 최대 용량

encrypt:
  secret-key: ${ENCRYPT_SECRET_KEY}

jwt:
  secret: ${JWT_SECRET_KEY}
  # [수정] 예전 값은 `${jwt.expiration}` - 자기 자신을 가리키는 자기참조 플레이스홀더였다.
  # 환경변수 JWT_EXPIRATION이 우연히 설정돼 있으면 우선순위 덕에 동작했지만,
  # 없으면 circular placeholder reference로 애플리케이션 부팅 자체가 실패한다.
  # 이제 환경변수를 우선 쓰되 없으면 기본 1시간(ms)으로 안전하게 떨어진다.
  expiration: ${JWT_EXPIRATION:3600000}

# 배포 환경마다 달라지는 프론트엔드 관련 설정.
# 로컬 개발은 기본값 그대로 쓰면 되고, 폰 테스트용 터널이나 실제 배포 시에는
# 환경변수(OAUTH2_REDIRECT_URI / CORS_ALLOWED_ORIGINS)로 덮어쓴다.
app:
  oauth2:
    # 소셜 로그인 성공 후 사용자를 돌려보낼 프론트엔드 콜백 주소.
    redirect-uri: http://localhost:5173/oauth/callback
  cors:
    # CORS 허용 Origin. 여러 개면 콤마로 구분한다.
    # 예) CORS_ALLOWED_ORIGINS=http://localhost:5173,https://xxx.trycloudflare.com
    allowed-origins: http://localhost:5173,http://localhost:5174,https://site-daisy-beaches-session.trycloudflare.com

server:
  port: 8080

# 구글 OCR API 사용을 위한 서비스 계정 키 파일 경로 설정
google:
  vision:
    api-key: ${GOOGLE_VISION_API_KEY}

# 한국관광공사 오픈API(한국관광콘텐츠랩, TourAPI) 설정
tour:
  api:
    base-url: https://apis.data.go.kr/B551011/KorService2
    service-key: ${TOUR_API_KEY}
    mobile-app: TripPamine
    mobile-os: ETC

openai:
  api:
    key: ${OPENAI_API_KEY}

# [Mock 은행 연동 추가] 계좌연동(실명확인) 시 호출하는 Mock 오픈뱅킹 서버 설정.
mock-bank:
  # Mock 서버가 이 애플리케이션 안에 함께 떠 있으므로 기본값은 자기 자신(localhost)
  base-url: http://localhost:${server.port}

finlife:
  api:
    base-url: https://finlife.fss.or.kr/finlifeapi
    auth-key: ${FINLIFE_API_KEY}
